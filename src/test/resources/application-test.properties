# =====================================================================
# Perfil "test": ativado com @ActiveProfiles("test") nos testes.
# Banco H2 em memória, criado do zero a cada execução da suíte e
# descartado quando a JVM termina. Não usa o PostgreSQL de desenvolvimento.
# =====================================================================

# ----- Não carrega o .env de desenvolvimento -----
# O springboot4-dotenv põe as chaves do .env ACIMA dos arquivos de configuração (ex.: MFA_MOCK_CODE
# viraria mfa.mock-code e RESEND_API_KEY viraria resend.api-key). Desligado, a suíte roda igual em
# qualquer máquina, com ou sem .env.
springdotenv.enabled=false

# ----- Banco de teste (H2 em memória, compatível com PostgreSQL) -----
# DATABASE_TO_LOWER + CASE_INSENSITIVE_IDENTIFIERS: o Spring Data JDBC mistura nomes
# minúsculos (@Table/@Column) com nomes derivados em maiúsculas no H2.
spring.datasource.url=jdbc:h2:mem:searchoteca_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Projeto usa Spring Data JDBC (sem Hibernate/ddl-auto): o schema é criado pelos scripts abaixo
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.data-locations=classpath:data-test.sql

# ----- JWT (chave só de teste, nunca usada em produção) -----
jwt.secret=chave-de-teste-searchoteca-integracao-0123456789-abcdefghij
jwt.expiration-ms=3600000

# ----- MFA em modo de teste: nenhum e-mail é enviado e o código aceito é este -----
mfa.enabled=true
mfa.mock-code=123456
# Limites relaxados: a suíte faz muitos logins seguidos e testa o reenvio sem esperar 60 s
mfa.max-codes-per-hour=1000
mfa.resend-cooldown-seconds=0

# ----- E-mail: sem chave, o EmailService não chama a API externa do Resend -----
resend.api-key=

# ----- Logs da suíte fora da pasta de logs da aplicação -----
logging.file.name=target/test-logs/searchoteca-test.log
